name: Deploy to GitHub Pages

# Publishes the browser-only build to GitHub Pages.
# Requires the repo to be PUBLIC (free plan) or on a paid plan that allows
# Pages for private repos. The first run auto-enables Pages via configure-pages.

on:
  push:
    branches: [claude/corporate-real-estate-portfolio-i3kb9a]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress Pages deployment finish rather than cancelling it — a
# cancelled deployment can get stuck and make the next run time out in "queued".
# (Matches GitHub's official Pages workflow.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build
        env:
          # Optional: set these as repo Variables (Settings → Secrets and
          # variables → Actions → Variables) so the hosted app auto-connects to
          # the cloud backend and only asks users to sign in. Left blank, the app
          # runs in local browser-only mode. The anon key is a public key.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Optional: a referrer-restricted Google Maps key, baked in so every
          # device has it. Leave unset to configure it per-browser in Settings.
          VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
